[project]
name = "bio-data-pneumonia-xray"
version = "0.1.0"
description = "Chest X-ray pneumonia anomaly detection and classification using ConvVAE and ResNet18."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "kagglehub",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
